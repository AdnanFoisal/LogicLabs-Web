name: Deploy Logic Labs Web (GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle & Kotlin/JS packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/nodejs
            ~/.gradle/yarn
          key: web-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            web-${{ runner.os }}-gradle-

      - name: Run JVM multiplatform verification tests
        run: ./gradlew :core-bridge:jvmTest :core-data:jvmTest :core-designsystem:jvmTest :feature-breadboard:jvmTest :feature-tools:jvmTest :core-testing:test :desktop-app:test --no-daemon

      - name: Build dual-engine WasmGC + JS fallback offline PWA
        run: ./gradlew :web-app:assembleCombinedWebDist --no-daemon

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined PWA site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-app/build/dist/combined

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
